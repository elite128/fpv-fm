<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <!-- PWA & Mobile Meta Tags -->
  <meta name="theme-color" content="#020617" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="/static/icon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg" />

  <title>FPV Telemetry Overview</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="display-body">
  <header class="display-header">
    <div>
      <h1 style="color: #ffffff;">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 0.5rem;">
          <polygon points="12 2 2 22 22 22"></polygon>
          <line x1="12" y1="18" x2="12" y2="12"></line>
        </svg>
        FPV TELEMETRY OVERVIEW
        <span id="version" style="background: rgba(255,255,255,0.08); color: #94a3b8; border-color: rgba(255,255,255,0.15);"></span>
      </h1>
      <p class="muted" id="eventName" style="color: #94a3b8; font-size: 1.1rem; margin-top: 0.3rem;">FPV Meetup</p>
    </div>
    <div id="connection" class="pill offline">offline</div>
  </header>
  
  <main class="display-main">
    <section class="display-stats" id="stats"></section>
    <section id="pilotList" class="display-list"></section>
  </main>
  
  <script src="/static/display.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b0f19" />
    </radialGradient>
    <linearGradient id="propGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="signalGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" />
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="#1e293b" stroke-width="6" opacity="0.5" />

  <!-- Radiating Wireless Signal Waves (Frequency) -->
  <g stroke="url(#signalGradient)" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.85">
    <!-- Outer Wave -->
    <path d="M 120 180 A 180 180 0 0 1 392 180" />
    <!-- Middle Wave -->
    <path d="M 160 210 A 130 130 0 0 1 352 210" />
    <!-- Inner Wave -->
    <path d="M 200 240 A 80 80 0 0 1 312 240" />
  </g>

  <!-- Stylized Quadcopter Propeller -->
  <g transform="translate(256, 310)" filter="url(#glow)">
    <!-- Propeller Center Hub -->
    <circle cx="0" cy="0" r="24" fill="#ffffff" />
    <circle cx="0" cy="0" r="14" fill="#0b0f19" />

    <!-- Propeller Blade Left -->
    <path d="M -24 -6 C -80 -35 -140 -20 -150 0 C -140 10 -80 5 -24 6 Z" fill="url(#propGradient)" />
    <!-- Propeller Blade Right -->
    <path d="M 24 6 C 80 35 140 20 150 0 C 140 -10 80 -5 24 -6 Z" fill="url(#propGradient)" />
    
    <!-- Little accent dots on blades -->
    <circle cx="-110" cy="-12" r="6" fill="#ffffff" opacity="0.7" />
    <circle cx="110" cy="12" r="6" fill="#ffffff" opacity="0.7" />
  </g>

  <!-- Stylized Antenna / FPV Signal Core -->
  <circle cx="256" cy="310" r="6" fill="#ffffff" />
</svg>
